name: E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      chromadb:
        image: chromadb/chroma:latest
        ports:
          - 8001:8000
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install ".[dev]"

      - name: Start API server
        run: uvicorn docmind.app:app --host 0.0.0.0 --port 8000 &
        env:
          DOCMIND_CHROMA_HOST: localhost
          DOCMIND_CHROMA_PORT: "8001"
          DOCMIND_JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET }}

      - name: Wait for API
        run: until curl -sf http://localhost:8000/health; do sleep 1; done
        timeout-minutes: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node deps
        working-directory: web
        run: npm install

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        run: npm run test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
